project:
  type: book
  output-dir: _book

book:
  title: "Drawing Inferences"
  author: "Marius Furter"
  date: today
  #site-url: https://drawinginferences.com
  # navbar:
  #   background: none
  #   title: " "
  #   search: true
  sidebar:
    logo: images/drawing-inferences-logo.png
    title: " "
    tools: []
    collapse-level: 1
  reader-mode: false
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - part: "Exercises"
      chapters:
        - exercises/1-classic-puzzles.qmd
        - exercises/2-credit-card.qmd
    - part: "Appendix"
      chapters:
        - appendix/pytorch.qmd
    - references.qmd

filters:
  - diagram

diagram:
  cache: true
  diagrams-path: diagrams
  engine:
    tikz:
      additional-packages: |
        \usepackage{tikz}
        \usetikzlibrary{backgrounds,arrows,shapes,shapes.geometric,shapes.misc,shapes.symbols,decorations.markings,calc}
        \pgfkeys{/tikz/tikzit fill/.initial=0}
        \pgfkeys{/tikz/tikzit draw/.initial=0}
        \pgfkeys{/tikz/tikzit shape/.initial=0}
        \pgfkeys{/tikz/tikzit category/.initial=0}
        \pgfdeclarelayer{edgelayer}
        \pgfdeclarelayer{nodelayer}
        \pgfsetlayers{background,edgelayer,nodelayer,main}
        \tikzstyle{none}=[inner sep=0mm]
        \input{/Users/mariusfurter/Documents/repos/drawing-inferences-notes/diagrams/string.tikzstyles}
        \tikzset{every picture/.style={scale=0.5}}

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, theme/custom-light.scss]
    html-math-method: mathjax
    include-in-header: theme/mathjax-config.html
    code-fold: true
    toc: true
    number-sections: true
    math: true

execute:
  freeze: auto
