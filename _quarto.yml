  author: "Marius Furter"
  date: today
  #site-url: https://drawinginferences.com
  # navbar:
  #   background: none
  #   title: " "
  #   search: true
  sidebar:
    logo: images/drawing-inferences-logo.png
    title: " "
    tools: []
    collapse-level: 1
  reader-mode: false
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - chapters/discrete-graphical-models.qmd
    - chapters/conditioning.qmd
    - chapters/hybrid-models.qmd
    - chapters/bayesian-data-analysis.qmd
    - chapters/mcmc.qmd
    - chapters/practical.qmd
    - chapters/smc.qmd
    - chapters/vi.qmd
    - part: "Exercises"
      chapters:
        - exercises/1-classic-puzzles.qmd
        - exercises/2-credit-card.qmd
        - exercises/3-stroke-prediction.qmd
        - exercises/4-hidden-markov-models.qmd
        - exercises/5-physics.qmd
